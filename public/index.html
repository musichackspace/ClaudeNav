<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClaudeNav</title>
<link id="favicon" rel="icon" href="data:," />
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1d212b; --border: #2a2f3a;
    --text: #e6e8ec; --muted: #8b93a1; --accent: #d97757; --live: #3fb950;
    --chip: #232834;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    border-bottom: 1px solid var(--border); padding: 14px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  h1 { font-size: 18px; margin: 0; letter-spacing: -0.3px; }
  h1 span { color: var(--accent); }
  .grow { flex: 1; }
  input[type=search] {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 8px 12px; border-radius: 8px; min-width: 240px; font-size: 14px;
  }
  select, button {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 8px 12px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  .meta { color: var(--muted); font-size: 12px; }
  .lights { display: inline-flex; gap: 12px; align-items: center; font-size: 12px; color: var(--muted); }
  .lights .l { display: inline-flex; gap: 5px; align-items: center; }
  .lights .light { width: 10px; height: 10px; }
  main { padding: 20px; max-width: 1100px; margin: 0 auto; }
  .project {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    margin-bottom: 18px; overflow: hidden;
  }
  .project-head {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    background: var(--panel2); border-bottom: 1px solid var(--border);
  }
  .project-name { font-weight: 600; font-size: 15px; }
  .project-path { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--chip);
    color: var(--muted); white-space: nowrap;
  }
  .badge.live { background: rgba(63,185,80,.15); color: var(--live); font-weight: 600; }
  .sessions { display: flex; flex-direction: column; }
  .session {
    display: flex; align-items: center; gap: 14px; padding: 12px 16px;
    border-top: 1px solid var(--border);
  }
  .session:hover { background: var(--panel2); }
  /* Traffic-light status indicator */
  .light { width: 12px; height: 12px; border-radius: 50%; background: #3a4150; flex: none; }
  .light.idle { background: #4a5160; }
  .light.waiting { background: var(--live); box-shadow: 0 0 8px 1px rgba(63,185,80,.55); }
  .light.working { background: #e3b341; box-shadow: 0 0 8px 1px rgba(227,179,65,.55); animation: pulse 1.1s ease-in-out infinite; }
  .light.interrupted { background: #f85149; box-shadow: 0 0 8px 1px rgba(248,81,73,.5); }
  .s-main { flex: 1; min-width: 0; }
  .s-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s-sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s-meta { color: var(--muted); font-size: 11px; text-align: right; white-space: nowrap; }
  .pill {
    font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px;
    flex: none; white-space: nowrap;
  }
  .pill.working { background: rgba(217,119,87,.18); color: var(--accent); }
  .pill.waiting { background: rgba(63,185,80,.16); color: var(--live); }
  .pill.interrupted { background: rgba(248,81,73,.16); color: #f85149; }
  .pill.idle { background: var(--chip); color: var(--muted); }
  .pill.working::before {
    content: '●'; margin-right: 5px; animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  .tok { font-family: ui-monospace, monospace; }
  .ctxbar {
    display: inline-block; width: 46px; height: 5px; border-radius: 3px;
    background: var(--chip); overflow: hidden; vertical-align: middle; margin-left: 4px;
  }
  .ctxbar > i { display: block; height: 100%; background: var(--accent); }
  .s-actions { display: flex; gap: 6px; flex: none; }
  .s-actions button { padding: 6px 10px; font-size: 12px; }
  .new-btn { margin-left: auto; }
  .empty { color: var(--muted); text-align: center; padding: 60px 20px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--border); padding: 10px 18px;
    border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50;
    max-width: 80vw;
  }
  .toast.show { opacity: 1; }
  .toast.err { border-color: #f85149; color: #f85149; }
  kbd { background: var(--chip); border-radius: 4px; padding: 1px 5px; font-size: 11px; }

  /* Active-folder cards */
  .folders { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
  .fcard {
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--live);
    border-radius: 10px; padding: 12px 14px; min-width: 180px; cursor: pointer;
  }
  .fcard:hover { border-color: var(--accent); }
  .fcard .fname { font-weight: 600; }
  .fcard .fmeta { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .fcard .fdot { color: var(--live); }
  .session { cursor: pointer; }

  /* Chat overlay */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none;
    align-items: stretch; justify-content: flex-end; z-index: 100;
  }
  .overlay.show { display: flex; }
  .overlay.center { align-items: center; justify-content: center; }

  /* Housekeeping panel */
  .hk { width: min(720px, 94%); max-height: 86vh; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; }
  .hk-body { overflow-y: auto; padding: 8px 16px 16px; }
  .repo { border: 1px solid var(--border); border-radius: 10px; margin-top: 12px; overflow: hidden; }
  .repo-head { display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: var(--panel); }
  .repo-name { font-weight: 600; }
  .repo-path { color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vbadge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
  .vbadge.clean { background: rgba(63,185,80,.16); color: var(--live); }
  .vbadge.dirty { background: rgba(227,179,65,.18); color: #e3b341; }
  .vbadge.unpushed { background: rgba(88,166,255,.18); color: #58a6ff; }
  .vbadge.busy { background: rgba(248,81,73,.16); color: #f85149; }
  .repo-detail { padding: 8px 14px 12px; font-size: 12.5px; }
  .repo-detail .gitline { color: var(--muted); margin-bottom: 8px; }
  .repo-detail .files { font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--muted); max-height: 120px; overflow-y: auto; margin-bottom: 10px; white-space: pre-wrap; }
  .repo-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .repo-actions button { font-size: 12px; padding: 6px 11px; }
  .repo-actions .primary { background: var(--accent); border-color: var(--accent); color: #1b1206; font-weight: 600; }
  .hk-bulk { display: flex; gap: 10px; align-items: center; padding: 10px 0 4px; }
  .hk-bulk .primary { background: var(--accent); border-color: var(--accent); color: #1b1206; font-weight: 600; }
  .hk-bulk .hint { color: var(--muted); font-size: 12px; }
  .hkres { font-size: 12.5px; margin: 4px 0 8px; padding: 6px 10px; border-radius: 7px; }
  .hkres.pending { background: var(--chip); color: var(--muted); }
  .hkres.safe { background: rgba(63,185,80,.14); color: var(--live); }
  .hkres.wip { background: rgba(248,81,73,.14); color: #f85149; }
  .chat {
    width: min(560px, 100%); background: var(--bg); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; height: 100%;
  }
  .chat-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; }
  .chat-head .ct { flex: 1; min-width: 0; }
  .statuslight { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 2px; }
  .statuslight .light { width: 16px; height: 16px; }
  #chatLightLabel { font-size: 9px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); white-space: nowrap; }
  .chat-head .ctitle { font-weight: 600; }
  .chat-head .csub { color: var(--muted); font-size: 12px; }
  .chat-close { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; padding: 0 4px; }
  .chat-body { flex: 1; overflow-y: auto; padding: 16px 18px; }
  .msg { margin-bottom: 14px; }
  .msg .who { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 3px; }
  .msg.user .bubble { background: var(--panel2); }
  .msg.assistant .bubble { background: transparent; }
  .bubble { padding: 8px 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; border: 1px solid var(--border); }
  .msg.assistant .bubble { border-color: transparent; padding-left: 0; }
  .tooluse { color: var(--muted); font-size: 12px; font-style: italic; }
  .chat-compose { border-top: 1px solid var(--border); padding: 12px 14px; }
  .chat-compose textarea {
    width: 100%; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 10px; font: inherit; resize: vertical; min-height: 52px;
  }
  .chat-compose .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .chat-compose .hint { color: var(--muted); font-size: 12px; flex: 1; }
  .chat-compose button { background: var(--accent); border-color: var(--accent); color: #1b1206; font-weight: 600; }
  .chat-compose button:disabled { opacity: .5; cursor: not-allowed; }
  .chat-compose select { max-width: 160px; }
  .chat-compose button.ghost { background: var(--panel2); color: var(--text); border-color: var(--border); font-weight: 400; }
  .chat-compose .row { gap: 8px; }
  .chat-compose .hint { flex: 1; }

  /* Markdown content inside assistant/user bubbles */
  .bubble .ln { min-height: 1em; }
  .bubble h4 { margin: 10px 0 4px; font-size: 14px; }
  .bubble ul { margin: 4px 0; padding-left: 20px; }
  .bubble li { margin: 2px 0; }
  .bubble a { color: var(--accent); }
  .bubble code {
    background: var(--chip); padding: 1px 5px; border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
  }
  .bubble pre {
    background: #0b0d12; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; margin: 8px 0;
  }
  .bubble pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.5; }
  .chatimg { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); margin: 6px 0; display: block; }

  /* Composer attachments */
  .attach { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .attach:empty { display: none; }
  .thumb { position: relative; }
  .thumb img { height: 56px; width: 56px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
  .thumb button {
    position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; padding: 0;
    border-radius: 50%; background: var(--panel2); border: 1px solid var(--border);
    color: var(--text); font-size: 13px; line-height: 1; cursor: pointer;
  }
</style>
</head>
<body>
<header>
  <h1>Claude<span>Nav</span></h1>
  <input id="search" type="search" placeholder="Search title, prompt, path, branch…" />
  <div class="grow"></div>
  <label class="meta">Open in
    <select id="termApp">
      <option value="Terminal">Terminal</option>
      <option value="iTerm">iTerm</option>
    </select>
  </label>
  <span id="lights" class="lights"></span>
  <button id="wrapup">🧹 Wrap-up</button>
  <button id="refresh">↻ Refresh</button>
  <span id="status" class="meta"></span>
</header>
<main>
  <div id="folders" class="folders"></div>
  <div id="content"><div class="empty">Loading sessions…</div></div>
</main>

<div id="overlay" class="overlay">
  <div class="chat">
    <div class="chat-head">
      <div class="statuslight"><span id="chatLight" class="light"></span><span id="chatLightLabel"></span></div>
      <div class="ct">
        <div id="chatTitle" class="ctitle"></div>
        <div id="chatSub" class="csub"></div>
      </div>
      <button class="chat-close" id="chatClose" title="Close">×</button>
    </div>
    <div id="chatBody" class="chat-body"></div>
    <div class="chat-compose" id="chatCompose"></div>
  </div>
</div>

<div id="hkOverlay" class="overlay center">
  <div class="hk">
    <div class="chat-head">
      <div class="ct">
        <div class="ctitle">🧹 Wrap-up — end-of-session housekeeping</div>
        <div class="csub" id="hkSub">Checking repositories…</div>
      </div>
      <button class="ghost" id="hkRefresh" title="Re-scan">↻</button>
      <button class="chat-close" id="hkClose" title="Close">×</button>
    </div>
    <div id="hkBody" class="hk-body"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
let DATA = { projects: [] };
let timer = null;

function timeAgo(ms) {
  if (!ms) return '';
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 60) return s + 's ago';
  const m = Math.floor(s / 60); if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60); if (h < 24) return h + 'h ago';
  const d = Math.floor(h / 24); return d + 'd ago';
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}
function fmtTok(n) {
  if (!n) return '0';
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M';
  if (n >= 1e3) return Math.round(n / 1e3) + 'K';
  return String(n);
}
// Approx Claude context window for the fill bar (200K standard).
const CTX_WINDOW = 200000;
const STATUS_LABEL = { working: 'Working', waiting: 'Your turn', interrupted: 'Interrupted', idle: 'Idle' };
function shortModel(m) {
  return (m || '').replace(/^claude-/, '').replace(/-\d{8}$/, '').replace(/\[1m\]$/, ' 1M');
}

// --- Minimal, safe Markdown renderer -----------------------------------------
function md(src) {
  if (!src) return '';
  const codeBlocks = [];
  // 1. Pull out fenced code blocks first so their contents aren't formatted.
  src = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const i = codeBlocks.length;
    codeBlocks.push(`<pre><code>${esc(code.replace(/\n$/, ''))}</code></pre>`);
    return ` CB${i} `;
  });
  // 2. Escape everything else.
  src = esc(src);
  // 3. Attached-image markers -> <img>.
  src = src.replace(/\[Attached image: ([^\]]+)\]/g, (_, p) =>
    ` IMG${encodeURIComponent(p.split('/').pop())} `);
  // 4. Inline formatting.
  src = src
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // 5. Block structure: headings, lists, paragraphs.
  const lines = src.split('\n');
  let html = '', inList = false;
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  for (let line of lines) {
    const h = /^(#{1,4})\s+(.*)$/.exec(line);
    const li = /^\s*[-*]\s+(.*)$/.exec(line);
    if (h) { closeList(); html += `<h4>${h[2]}</h4>`; }
    else if (li) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${li[1]}</li>`; }
    else if (line.trim() === '') { closeList(); }
    else if (line.startsWith(' CB')) { closeList(); html += line; }
    else { closeList(); html += `<div class="ln">${line}</div>`; }
  }
  closeList();
  // 6. Restore code blocks and images.
  html = html
    .replace(/ CB(\d+) /g, (_, i) => codeBlocks[+i])
    .replace(/ IMG([^ ]+) /g, (_, n) =>
      `<a href="/uploads/${n}" target="_blank"><img class="chatimg" src="/uploads/${n}" alt="attachment"></a>`);
  return html;
}
function termApp() { return document.getElementById('termApp').value; }

function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.className = 'toast'; }, 3200);
}

async function openTerminal(payload) {
  try {
    const r = await fetch('/api/open', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...payload, app: termApp() }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'failed');
    toast('Opened ' + termApp() + ': ' + j.ran);
  } catch (e) {
    toast('Could not open terminal: ' + e.message, true);
  }
}

function matchesQuery(s, p, q) {
  if (!q) return true;
  const hay = (s.title + ' ' + s.lastPrompt + ' ' + p.cwd + ' ' + s.gitBranch).toLowerCase();
  return hay.includes(q);
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const root = document.getElementById('content');
  let html = '';
  let shown = 0;

  for (const p of DATA.projects) {
    const sessions = p.sessions.filter(s => matchesQuery(s, p, q));
    if (!sessions.length) continue;
    shown += sessions.length;

    const liveBadge = p.liveTerminals > 0
      ? `<span class="badge live">● ${p.liveTerminals} live terminal${p.liveTerminals > 1 ? 's' : ''}</span>`
      : '';

    html += `<div class="project" id="proj-${esc(p.cwd.replace(/[^a-zA-Z0-9]/g, '_'))}">
      <div class="project-head">
        <span class="project-name">${esc(p.name)}</span>
        ${liveBadge}
        <span class="badge">${p.sessions.length} session${p.sessions.length > 1 ? 's' : ''}</span>
        <span class="project-path">${esc(p.cwd)}</span>
        <button class="new-btn" data-newterm="${esc(p.cwd)}">+ New terminal</button>
        <button data-newchat="${esc(p.cwd)}" data-newname="${esc(p.name)}" title="Start a headless session in the browser">+ New headless</button>
      </div>
      <div class="sessions">`;

    for (const s of sessions) {
      const t = s.tokens || {};
      const win = (s.contextTokens || 0) > 200000 ? 1000000 : CTX_WINDOW;
      const ctxPct = Math.min(100, Math.round((s.contextTokens || 0) / win * 100));
      const model = s.models && s.models.length ? shortModel(s.models[s.models.length - 1]) : '';
      const tokTip =
        `output ${fmtTok(t.output)} · billed input ${fmtTok((t.input||0)+(t.cacheCreation||0))} · ` +
        `cache read ${fmtTok(t.cacheRead)} · context ${fmtTok(s.contextTokens)} (${ctxPct}% of ${win === CTX_WINDOW ? '200K' : '1M'})` +
        (model ? ` · ${esc(model)}` : '');
      html += `<div class="session" data-session="${esc(s.sessionId)}" title="Click to view conversation">
        <span class="light ${s.status}" title="${STATUS_LABEL[s.status] || s.status}"></span>
        <span class="pill ${s.status}">${STATUS_LABEL[s.status] || s.status}</span>
        <div class="s-main">
          <div class="s-title">${esc(s.title)}</div>
          <div class="s-sub">${s.gitBranch ? '⎇ ' + esc(s.gitBranch) + ' · ' : ''}${esc(s.lastPrompt) || '<em>no prompt</em>'}</div>
        </div>
        <div class="s-meta" title="${tokTip}">
          ${timeAgo(s.mtimeMs)} · ${s.userMsgCount} msgs<br>
          <span class="tok">↓${fmtTok(t.output)} out</span> ·
          <span class="tok">${fmtTok(s.contextTokens)} ctx</span>
          <span class="ctxbar"><i style="width:${ctxPct}%"></i></span>
        </div>
        <div class="s-actions">
          <button data-resume="${esc(s.sessionId)}" data-cwd="${esc(p.cwd)}">Resume ▸</button>
          <button data-copy="${esc(s.sessionId)}" data-cwd="${esc(p.cwd)}" title="Copy resume command">⧉</button>
        </div>
      </div>`;
    }
    html += `</div></div>`;
  }

  root.innerHTML = shown ? html : '<div class="empty">No sessions match your search.</div>';
  document.getElementById('status').textContent =
    `${DATA.projects.length} projects · updated ${new Date(DATA.generatedAt).toLocaleTimeString()}`;
  renderFolders();
  renderLightSummary();
}

function renderLightSummary() {
  const counts = { working: 0, waiting: 0, interrupted: 0 };
  for (const p of DATA.projects) for (const s of p.sessions)
    if (counts[s.status] !== undefined) counts[s.status]++;
  const parts = [];
  if (counts.working) parts.push(`<span class="l"><span class="light working"></span>${counts.working} working</span>`);
  if (counts.waiting) parts.push(`<span class="l"><span class="light waiting"></span>${counts.waiting} ready</span>`);
  if (counts.interrupted) parts.push(`<span class="l"><span class="light interrupted"></span>${counts.interrupted} stalled</span>`);
  document.getElementById('lights').innerHTML = parts.join('');
}

function renderFolders() {
  const live = DATA.projects.filter(p => p.liveTerminals > 0);
  const el = document.getElementById('folders');
  if (!live.length) { el.innerHTML = ''; return; }
  el.innerHTML = live.map(p => {
    const active = p.sessions.filter(s => s.status === 'working' || s.status === 'waiting').length;
    return `<div class="fcard" data-goto="proj-${esc(p.cwd.replace(/[^a-zA-Z0-9]/g, '_'))}">
      <div class="fname"><span class="fdot">●</span> ${esc(p.name)}</div>
      <div class="fmeta">${p.liveTerminals} live terminal${p.liveTerminals > 1 ? 's' : ''} · ${p.sessions.length} sessions${active ? ` · ${active} active` : ''}</div>
    </div>`;
  }).join('');
}

document.getElementById('folders').addEventListener('click', e => {
  const card = e.target.closest('.fcard');
  if (!card) return;
  const target = document.getElementById(card.dataset.goto);
  if (target) { target.scrollIntoView({ behavior: 'smooth', block: 'start' }); target.style.outline = '2px solid var(--accent)'; setTimeout(() => target.style.outline = '', 1200); }
});

document.getElementById('content').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (btn) {
    if (btn.dataset.newterm) openTerminal({ cwd: btn.dataset.newterm });
    else if (btn.dataset.newchat) openNewChat(btn.dataset.newchat, btn.dataset.newname || btn.dataset.newchat);
    else if (btn.dataset.resume) openTerminal({ cwd: btn.dataset.cwd, sessionId: btn.dataset.resume });
    else if (btn.dataset.copy) {
      const cmd = `cd ${JSON.stringify(btn.dataset.cwd)} && claude --resume ${btn.dataset.copy}`;
      navigator.clipboard.writeText(cmd).then(() => toast('Copied: ' + cmd));
    }
    return;
  }
  const row = e.target.closest('.session');
  if (row && row.dataset.session) openChat(row.dataset.session);
});

// ---- Chat panel ------------------------------------------------------------
let chat = { sessionId: null, total: 0, poll: null, running: false, attachments: [], cwd: null, isNew: false };

function findSession(id) {
  for (const p of DATA.projects) {
    const s = p.sessions.find(x => x.sessionId === id);
    if (s) return { p, s };
  }
  return null;
}

function openChat(id) {
  const found = findSession(id);
  if (!found) return;
  const { p, s } = found;
  chat.sessionId = id;
  chat.total = 0;
  chat.running = false;
  chat.name = s.title;
  chat.cwd = p.cwd;
  chat.isNew = false;
  setChatLight(s.status === 'working' ? 'working' : s.status === 'interrupted' ? 'interrupted' : 'waiting',
    s.status === 'working' ? 'Working' : 'Ready');
  document.getElementById('chatTitle').textContent = s.title;
  document.getElementById('chatSub').textContent =
    `${p.name} · ${STATUS_LABEL[s.status] || s.status}` + (s.gitBranch ? ` · ⎇ ${s.gitBranch}` : '');
  document.getElementById('chatBody').innerHTML = '<div class="empty">Loading conversation…</div>';
  renderCompose(p, s);
  document.getElementById('overlay').classList.add('show');
  loadTranscript(true);
  checkChatStatus();
  clearInterval(chat.poll);
  chat.poll = setInterval(pollTick, 2000);
}

// Start a brand-new session headlessly in a folder — no terminal. We pick the
// session id up front so the panel attaches immediately; the first send creates
// it (server uses --session-id), later sends continue it (--resume).
function openNewChat(cwd, name) {
  chat.sessionId = (crypto.randomUUID && crypto.randomUUID()) ||
    'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  chat.total = 0;
  chat.running = false;
  chat.cwd = cwd;
  chat.isNew = true;
  chat.name = 'New session · ' + name;
  setChatLight('waiting', 'Ready');
  document.getElementById('chatTitle').textContent = 'New session';
  document.getElementById('chatSub').textContent = `${name} · type a message to start`;
  document.getElementById('chatBody').innerHTML =
    '<div class="empty">New headless session in this folder.<br>Send a message to begin — no terminal needed.</div>';
  renderCompose({ liveTerminals: 0 }, null);
  document.getElementById('overlay').classList.add('show');
  checkChatStatus();
  clearInterval(chat.poll);
  chat.poll = setInterval(pollTick, 2000);
}

function closeChat() {
  document.getElementById('overlay').classList.remove('show');
  clearInterval(chat.poll);
  chat.sessionId = null;
  resetTabSignal();
}

// --- Traffic-light feedback --------------------------------------------------
const LIGHT_COLORS = { working: '#e3b341', waiting: '#3fb950', ready: '#3fb950', interrupted: '#f85149', idle: '#4a5160' };

function setChatLight(status, label) {
  const el = document.getElementById('chatLight');
  const lab = document.getElementById('chatLightLabel');
  if (el) el.className = 'light ' + status;
  if (lab) lab.textContent = label || '';
}

function setFavicon(color) {
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const x = c.getContext('2d');
  x.beginPath(); x.arc(16, 16, 13, 0, 7); x.fillStyle = color; x.fill();
  document.getElementById('favicon').href = c.toDataURL('image/png');
}

let titleFlash = null;
function setTabSignal(state) {
  // state: 'working' | 'ready' | null
  clearInterval(titleFlash);
  if (state === 'working') {
    document.title = '⏳ Working — ClaudeNav';
    setFavicon(LIGHT_COLORS.working);
  } else if (state === 'ready') {
    setFavicon(LIGHT_COLORS.ready);
    // Flash the tab title so a backgrounded tab gets noticed.
    let on = true;
    const name = chat.name ? ' · ' + chat.name : '';
    document.title = '🟢 Ready' + name;
    titleFlash = setInterval(() => {
      document.title = (on ? '🟢 Ready — your turn' : 'ClaudeNav') + name;
      on = !on;
    }, 1000);
  } else {
    resetTabSignal();
  }
}
function resetTabSignal() {
  clearInterval(titleFlash);
  document.title = 'ClaudeNav';
  setFavicon(LIGHT_COLORS.idle);
}

// Desktop notification when a turn finishes (only if the tab isn't focused).
function notifyReady() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  if (document.hasFocus()) return; // tab flash is enough when you're looking
  try {
    const n = new Notification('🟢 Ready — your turn', {
      body: (chat.name || 'A Claude session') + ' finished and is waiting for you.',
      tag: 'claudenav-' + chat.sessionId, // collapse repeats per session
    });
    n.onclick = () => { window.focus(); n.close(); };
  } catch {}
}

function ensureNotifyPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission().catch(() => {});
  }
}
// Stop flashing once the user looks at the tab.
window.addEventListener('focus', () => { if (titleFlash) { clearInterval(titleFlash); document.title = 'ClaudeNav' + (chat.name ? ' · ' + chat.name : ''); } });

function renderCompose(p, s) {
  const el = document.getElementById('chatCompose');
  const liveNote = p.liveTerminals > 0
    ? `<span class="hint">also open in a terminal — that's fine; each browser turn continues from the latest</span>` : '';
  el.innerHTML = `
    <div id="attach" class="attach"></div>
    <textarea id="composeBox" placeholder="Message this session… paste or drop an image to attach (Enter to send, Shift+Enter for newline)"></textarea>
    <div class="row">
      <button id="attachBtn" class="ghost" title="Attach image">📎</button>
      <input id="fileInput" type="file" accept="image/*" multiple hidden>
      ${liveNote}<span id="working" class="hint"></span><button id="sendBtn">Send ▸</button>
    </div>`;
  const box = el.querySelector('#composeBox');
  el.querySelector('#sendBtn').onclick = doSend;
  el.querySelector('#attachBtn').onclick = () => el.querySelector('#fileInput').click();
  el.querySelector('#fileInput').onchange = ev => { addFiles(ev.target.files); ev.target.value = ''; };
  box.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); doSend(); }
  });
  box.addEventListener('paste', ev => {
    const imgs = [...(ev.clipboardData?.items || [])].filter(i => i.type.startsWith('image/'));
    if (imgs.length) { ev.preventDefault(); addFiles(imgs.map(i => i.getAsFile())); }
  });
  box.addEventListener('dragover', ev => { ev.preventDefault(); });
  box.addEventListener('drop', ev => {
    if (ev.dataTransfer?.files?.length) { ev.preventDefault(); addFiles(ev.dataTransfer.files); }
  });
  renderAttachments();
  box.focus();
}

function addFiles(files) {
  [...files].filter(Boolean).filter(f => f.type.startsWith('image/')).forEach(f => {
    const reader = new FileReader();
    reader.onload = () => { chat.attachments.push(reader.result); renderAttachments(); };
    reader.readAsDataURL(f);
  });
}

function renderAttachments() {
  const el = document.getElementById('attach');
  if (!el) return;
  el.innerHTML = chat.attachments.map((src, i) =>
    `<div class="thumb"><img src="${src}"><button data-rm="${i}" title="Remove">×</button></div>`).join('');
  el.querySelectorAll('button[data-rm]').forEach(b => b.onclick = () => {
    chat.attachments.splice(+b.dataset.rm, 1); renderAttachments();
  });
}

// Reflect server state: running + how many turns are queued behind it.
function setStatus(running, queued) {
  const was = chat.running;
  chat.running = running;
  const w = document.getElementById('working');
  if (w) w.textContent = running
    ? '⏳ Claude is working…' + (queued > 0 ? ` (${queued} queued)` : '')
    : '';
  if (running) {
    setChatLight('working', queued > 0 ? `Working · ${queued} queued` : 'Working');
    setTabSignal('working');
  } else {
    setChatLight('waiting', 'Ready');
    // Only fire the "ready" notification on a real working→ready transition.
    if (was) { setTabSignal('ready'); toast('🟢 Ready — your turn'); notifyReady(); }
  }
}

async function doSend() {
  const box = document.getElementById('composeBox');
  const text = box.value.trim();
  const images = chat.attachments.slice();
  if (!text && !images.length) return; // sending while a turn runs is fine — it queues server-side
  ensureNotifyPermission(); // ask once, on this user gesture
  box.value = '';
  chat.attachments = [];
  renderAttachments();
  setStatus(true, 0);
  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: chat.sessionId, text, images, cwd: chat.cwd }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'failed');
    if (chat.isNew) { chat.isNew = false; load(); } // refresh list so the new session appears
    setTimeout(() => loadTranscript(false), 600);
  } catch (e) {
    toast('Chat failed: ' + e.message, true);
    box.value = text; // restore so the message isn't lost
    chat.attachments = images;
    renderAttachments();
  }
  box.focus();
}

async function checkChatStatus() {
  if (!chat.sessionId) return;
  try {
    const r = await fetch(`/api/chat-status?session=${encodeURIComponent(chat.sessionId)}`);
    const j = await r.json();
    setStatus(j.running, j.queued || 0);
    if (j.error && !j.running) toast('Turn error: ' + j.error, true);
  } catch {}
}

function pollTick() {
  loadTranscript(false);
  checkChatStatus();
}

async function loadTranscript(reset) {
  if (!chat.sessionId) return;
  const after = reset ? 0 : chat.total;
  try {
    const r = await fetch(`/api/transcript?session=${encodeURIComponent(chat.sessionId)}&after=${after}`);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'failed');
    const body = document.getElementById('chatBody');
    if (reset) body.innerHTML = '';
    if (j.messages.length) {
      if (after === 0 && body.querySelector('.empty')) body.innerHTML = ''; // clear placeholder
      const nearBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 200;
      body.insertAdjacentHTML('beforeend', j.messages.map(renderMsg).join(''));
      if (reset || nearBottom) body.scrollTop = body.scrollHeight;
    } else if (reset) {
      body.innerHTML = '<div class="empty">No conversation yet.</div>';
    }
    chat.total = j.total; // server-reported message count = next cursor
  } catch (e) { /* transient */ }
}

function renderMsg(m) {
  const tools = m.tools && m.tools.length
    ? `<div class="tooluse">⚙ ${m.tools.map(esc).join(' · ')}</div>` : '';
  const text = m.text ? `<div class="bubble">${md(m.text)}</div>` : '';
  return `<div class="msg ${m.role}">
    <div class="who">${m.role === 'user' ? 'You' : 'Claude'}</div>${text}${tools}</div>`;
}

document.getElementById('chatClose').addEventListener('click', closeChat);
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target.id === 'overlay') closeChat();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeChat(); closeHousekeeping(); } });

async function load() {
  try {
    const r = await fetch('/api/sessions');
    DATA = await r.json();
    render();
  } catch (e) {
    document.getElementById('content').innerHTML = '<div class="empty">Failed to load: ' + esc(e.message) + '</div>';
  }
}

// --- Housekeeping / Wrap-up --------------------------------------------------
const VERDICT_LABEL = { clean: 'Safe to close', dirty: 'Unsaved changes', unpushed: 'Unpushed commits', busy: 'Busy — working' };
let HK = { repos: [] };
const hkResult = {}; // cwd -> { state, text }  progress/result per repo

function openHousekeeping() {
  document.getElementById('hkOverlay').classList.add('show');
  loadHousekeeping();
}
function closeHousekeeping() { document.getElementById('hkOverlay').classList.remove('show'); }

async function loadHousekeeping() {
  const body = document.getElementById('hkBody');
  body.innerHTML = '<div class="empty">Scanning repositories…</div>';
  try {
    const r = await fetch('/api/housekeeping');
    HK = await r.json();
    renderHk();
  } catch (e) { body.innerHTML = '<div class="empty">Failed: ' + esc(e.message) + '</div>'; }
}

function renderHk() {
  const d = HK;
  const counts = { dirty: 0, unpushed: 0, busy: 0, clean: 0 };
  d.repos.forEach(r => counts[r.verdict]++);
  document.getElementById('hkSub').textContent =
    `${counts.clean} safe · ${counts.dirty} unsaved · ${counts.unpushed} unpushed · ${counts.busy} busy`;
  const wrappable = d.repos.filter(r => r.verdict !== 'busy').length;
  const body = document.getElementById('hkBody');
  body.innerHTML =
    `<div class="hk-bulk">
       <button class="primary" id="wrapAll" ${wrappable ? '' : 'disabled'}>▶ Wrap up ${wrappable} safe-candidate folder${wrappable !== 1 ? 's' : ''}</button>
       <span class="hint">enquires each session, saves &amp; pushes, then closes — work-in-progress is left open</span>
     </div>`
    + (d.repos.map(repoHtml).join('') || '<div class="empty">No sessions.</div>');
  body.querySelector('#wrapAll')?.addEventListener('click', wrapAll);
  body.querySelectorAll('button[data-commit]').forEach(b => b.onclick = () => doCommit(b.dataset.commit, b.dataset.name));
  body.querySelectorAll('button[data-push]').forEach(b => b.onclick = () => doPush(b.dataset.push));
  body.querySelectorAll('button[data-assess]').forEach(b => b.onclick = () => doAssess(b.dataset.assess));
  body.querySelectorAll('button[data-close]').forEach(b => b.onclick = () => doClose(b.dataset.close, b.dataset.name));
}

function repoHtml(r) {
  const g = r.git || {};
  const gitline = !g.isRepo ? 'not a git repo'
    : `⎇ ${esc(g.branch || '?')}${g.dirty ? ` · ${g.dirty} uncommitted` : ''}${g.ahead ? ` · ${g.ahead} ahead` : ''}${g.behind ? ` · ${g.behind} behind` : ''}${g.hasRemote ? '' : ' · no remote'}`;
  const files = (g.files && g.files.length) ? `<div class="files">${g.files.map(esc).join('\n')}</div>` : '';
  const idleSession = r.sessions.find(s => s.status !== 'working');
  const actions = [];
  if (r.verdict !== 'busy' && idleSession)
    actions.push(`<button data-assess="${esc(idleSession.sessionId)}">Enquire (AI)</button>`);
  if (r.verdict === 'dirty') actions.push(`<button class="primary" data-commit="${esc(r.cwd)}" data-name="${esc(r.name)}">Commit</button>`);
  if (g.ahead > 0 && g.hasRemote) actions.push(`<button data-push="${esc(r.cwd)}">Push</button>`);
  if (r.verdict !== 'busy' && r.liveTerminals > 0)
    actions.push(`<button data-close="${esc(r.sessions[0]?.sessionId || '')}" data-name="${esc(r.name)}">Close terminal${r.liveTerminals > 1 ? 's' : ''}</button>`);
  const res = hkResult[r.cwd];
  const resLine = res ? `<div class="hkres ${res.state}">${esc(res.text)}</div>` : '';
  return `<div class="repo">
    <div class="repo-head">
      <span class="vbadge ${r.verdict}">${VERDICT_LABEL[r.verdict]}</span>
      <span class="repo-name">${esc(r.name)}</span>
      <span class="repo-path">${esc(r.cwd)}</span>
    </div>
    <div class="repo-detail">
      <div class="gitline">${gitline} · ${r.sessions.length} session${r.sessions.length > 1 ? 's' : ''}${r.liveTerminals ? ` · ${r.liveTerminals} live` : ''}</div>
      ${files}${resLine}
      <div class="repo-actions">${actions.join('') || '<span class="hint">nothing to do — safe to close</span>'}</div>
    </div>
  </div>`;
}

function setRes(cwd, state, text) { hkResult[cwd] = { state, text }; renderHk(); }

async function api(path, payload) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'failed');
  return j;
}

async function doCommit(cwd, name) {
  const msg = prompt(`Commit message for ${name}:`, 'checkpoint (ClaudeNav wrap-up)');
  if (msg === null) return;
  try { await api('/api/commit', { cwd, message: msg }); toast('Committed ' + name); loadHousekeeping(); }
  catch (e) { toast('Commit failed: ' + e.message, true); }
}
async function doPush(cwd) {
  try { await api('/api/push', { cwd }); toast('Pushed'); loadHousekeeping(); }
  catch (e) { toast('Push failed: ' + e.message, true); }
}
async function doAssess(sessionId) {
  const repo = HK.repos.find(r => r.sessions.some(s => s.sessionId === sessionId));
  if (repo) setRes(repo.cwd, 'pending', 'Enquiring…');
  try {
    const v = await api('/api/assess', { session: sessionId });
    if (repo) setRes(repo.cwd, v.safe ? 'safe' : 'wip', (v.safe ? '🟢 Safe — ' : '🔴 WIP — ') + (v.reason || ''));
  } catch (e) { if (repo) setRes(repo.cwd, 'wip', 'Enquiry failed: ' + e.message); }
}
async function doClose(sessionId, name) {
  if (!confirm(`Close the live terminal(s) for ${name}? The session is saved and can be resumed.`)) return;
  try { const j = await api('/api/close', { session: sessionId }); toast(`Closed ${j.killed} terminal(s) in ${name}`); setTimeout(loadHousekeeping, 800); }
  catch (e) { toast('Close failed: ' + e.message, true); }
}

// The orchestrated command: enquire each candidate, save+push, then exit. WIP stays open.
async function wrapAll() {
  const candidates = HK.repos.filter(r => r.verdict !== 'busy');
  if (!candidates.length) return;
  if (!confirm(`Wrap up ${candidates.length} folder(s)?\n\nFor each: ask the session if it's safe, commit + push if there are changes, then close its terminal. Anything flagged work-in-progress is left open and untouched.`)) return;
  const btn = document.getElementById('wrapAll'); if (btn) btn.disabled = true;

  for (const r of candidates) {
    const idle = r.sessions.find(s => s.status !== 'working');
    try {
      // 1. Enquire
      let verdict = { safe: true, reason: 'no session to ask', commitMessage: '' };
      if (idle) { setRes(r.cwd, 'pending', 'Enquiring…'); verdict = await api('/api/assess', { session: idle.sessionId }); }
      if (!verdict.safe) { setRes(r.cwd, 'wip', '🔴 WIP — left open — ' + (verdict.reason || '')); continue; }

      // 2. Update repo
      const did = [];
      if (r.git?.isRepo && r.git.dirty > 0) {
        setRes(r.cwd, 'pending', 'Committing…');
        await api('/api/commit', { cwd: r.cwd, message: verdict.commitMessage || 'checkpoint (ClaudeNav wrap-up)' });
        did.push('committed');
      }
      if (r.git?.isRepo && r.git.hasRemote) {
        try { setRes(r.cwd, 'pending', 'Pushing…'); await api('/api/push', { cwd: r.cwd }); did.push('pushed'); } catch {}
      }
      // 3. Gracefully exit
      if (r.liveTerminals > 0 && idle) {
        setRes(r.cwd, 'pending', 'Closing…');
        try { await api('/api/close', { session: idle.sessionId }); did.push('closed'); } catch {}
      }
      setRes(r.cwd, 'safe', '🟢 Wrapped' + (did.length ? ' — ' + did.join(', ') : ' — nothing to do'));
    } catch (e) {
      setRes(r.cwd, 'wip', 'Skipped — ' + e.message);
    }
  }
  toast('Wrap-up complete');
  setTimeout(loadHousekeeping, 1000);
}

document.getElementById('wrapup').addEventListener('click', openHousekeeping);
document.getElementById('hkClose').addEventListener('click', closeHousekeeping);
document.getElementById('hkRefresh').addEventListener('click', loadHousekeeping);
document.getElementById('hkOverlay').addEventListener('click', e => { if (e.target.id === 'hkOverlay') closeHousekeeping(); });

document.getElementById('search').addEventListener('input', render);
document.getElementById('refresh').addEventListener('click', load);
setFavicon(LIGHT_COLORS.idle);
// Auto-refresh every 5s so live terminals stay current.
timer = setInterval(load, 5000);
load();
</script>
</body>
</html>
