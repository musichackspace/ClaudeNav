<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GitHub History</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1d212b; --border: #2a2f3a;
    --text: #e6e8ec; --muted: #8b93a1; --accent: #d97757; --live: #3fb950;
    --chip: #232834;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    border-bottom: 1px solid var(--border); padding: 16px 24px;
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  h1 { font-size: 18px; margin: 0; letter-spacing: -0.3px; white-space: nowrap; }
  h1 span { color: var(--accent); }
  form { display: flex; gap: 8px; flex: 1; min-width: 280px; }
  input {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 8px 12px; border-radius: 8px; flex: 1; font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  .ratemeta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .empty { color: var(--muted); text-align: center; padding: 80px 20px; }
  .empty code { background: var(--chip); padding: 2px 6px; border-radius: 4px; }
  .err { border-color: #f85149 !important; color: #f85149; }
  .errbox {
    background: var(--panel); border: 1px solid #f85149; color: #f85149;
    border-radius: 10px; padding: 16px 18px; margin-bottom: 18px;
  }
  .loading { color: var(--muted); text-align: center; padding: 60px; }

  /* Repo header card */
  .repohead {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px; margin-bottom: 18px;
  }
  .repohead .title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .repohead a.name { font-size: 20px; font-weight: 700; color: var(--text); text-decoration: none; }
  .repohead a.name:hover { color: var(--accent); }
  .repohead .archived { font-size: 11px; background: rgba(227,179,65,.18); color: #e3b341; padding: 2px 8px; border-radius: 99px; }
  .repohead .desc { color: var(--muted); margin: 8px 0 14px; }
  .stats { display: flex; gap: 26px; flex-wrap: wrap; }
  .stat .n { font-size: 20px; font-weight: 700; font-family: ui-monospace, monospace; }
  .stat .l { color: var(--muted); font-size: 12px; }
  .topics { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .topic { font-size: 11px; background: var(--chip); color: var(--muted); padding: 2px 9px; border-radius: 99px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 18px;
  }
  .card.span { grid-column: 1 / -1; }
  .card h2 { font-size: 14px; margin: 0 0 4px; }
  .card .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .card .none { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .bar { fill: var(--accent); }
  .bar.soft { fill: #3a4150; }
  .axis { stroke: var(--border); }
  .axislabel { fill: var(--muted); font-size: 10px; font-family: ui-monospace, monospace; }
  .gridline { stroke: var(--border); stroke-dasharray: 2 3; opacity: .5; }

  /* Contributors */
  .contrib { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .contrib img { width: 26px; height: 26px; border-radius: 50%; flex: none; background: var(--chip); }
  .contrib .who { width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .contrib .who a { color: var(--text); text-decoration: none; }
  .contrib .who a:hover { color: var(--accent); }
  .contrib .track { flex: 1; height: 16px; background: var(--chip); border-radius: 4px; overflow: hidden; }
  .contrib .fill { height: 100%; background: var(--accent); }
  .contrib .c { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); width: 64px; text-align: right; }

  /* Languages */
  .langbar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
  .langbar > i { height: 100%; }
  .langlegend { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .langlegend .li { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .langlegend .dot { width: 10px; height: 10px; border-radius: 50%; }
  .langlegend .pct { color: var(--muted); }

  /* Commits */
  .commit { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); }
  .commit:first-child { border-top: none; }
  .commit img { width: 22px; height: 22px; border-radius: 50%; flex: none; background: var(--chip); margin-top: 2px; }
  .commit .body { flex: 1; min-width: 0; }
  .commit .msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .commit .msg a { color: var(--text); text-decoration: none; }
  .commit .msg a:hover { color: var(--accent); }
  .commit .sub { color: var(--muted); font-size: 12px; }
  .commit .sha { font-family: ui-monospace, monospace; color: var(--accent); }

  /* Punch card */
  .punchwrap { overflow-x: auto; }
  .punch { border-collapse: collapse; }
  .punch td, .punch th { padding: 1px; }
  .punch th { color: var(--muted); font-size: 10px; font-weight: 500; font-family: ui-monospace, monospace; }
  .punch .day { color: var(--muted); font-size: 11px; padding-right: 8px; text-align: right; }
  .punch .cell { width: 13px; height: 13px; border-radius: 3px; }
</style>
</head>
<body>
<header>
  <h1>GitHub <span>History</span></h1>
  <form id="form">
    <input id="repo" placeholder="owner/name  or  https://github.com/owner/name" autocomplete="off" autofocus />
    <button type="submit">Visualize</button>
  </form>
  <span class="ratemeta" id="ratemeta"></span>
</header>
<main id="main">
  <div class="empty">
    Enter a public repository — e.g. <code>facebook/react</code>, <code>torvalds/linux</code>, <code>anthropics/anthropic-sdk-python</code> — to see its history.
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const main = $('main');
const form = $('form');
const repoInput = $('repo');

const LANG_COLORS = ['#d97757','#3fb950','#58a6ff','#e3b341','#bc8cff','#f778ba','#39c5cf','#ff7b72','#a5d6ff','#7ee787'];

const num = (n) => (n == null ? '–' : n.toLocaleString());
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '–';
function ago(iso) {
  if (!iso) return '';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  const u = [['year',31536000],['month',2592000],['day',86400],['hour',3600],['minute',60]];
  for (const [name, secs] of u) { const v = Math.floor(s / secs); if (v >= 1) return `${v} ${name}${v > 1 ? 's' : ''} ago`; }
  return 'just now';
}

form.addEventListener('submit', (e) => { e.preventDefault(); load(repoInput.value); });

async function load(repo) {
  repo = (repo || '').trim();
  if (!repo) return;
  history.replaceState(null, '', '#' + encodeURIComponent(repo));
  main.innerHTML = `<div class="loading">Fetching history for <b>${esc(repo)}</b>…</div>`;
  $('ratemeta').textContent = '';
  try {
    const r = await fetch('/api/repo?repo=' + encodeURIComponent(repo));
    const data = await r.json();
    if (!r.ok) { renderError(data.error || ('HTTP ' + r.status)); return; }
    render(data);
  } catch (e) {
    renderError(e.message || 'Request failed');
  }
}

function renderError(msg) {
  main.innerHTML = `<div class="errbox">${esc(msg)}</div>`;
}

function render(d) {
  const rate = d.rateRemaining != null
    ? `${d.rateRemaining} API calls left${d.tokenInUse ? '' : ' (set GITHUB_TOKEN to raise the limit)'}`
    : '';
  $('ratemeta').textContent = rate;

  const r = d.repo;
  main.innerHTML = `
    ${repoHead(r)}
    ${card('Commits per week', 'Last 52 weeks', commitActivitySvg(d.commitActivity), 'span')}
    <div class="grid">
      ${card('Top contributors', `${d.contributors.length} shown`, contributorsHtml(d.contributors))}
      ${card('Languages', 'By bytes of code', languagesHtml(d.languages))}
    </div>
    ${card('When commits happen', 'Local repo time, by weekday & hour', punchCardHtml(d.punchCard), 'span')}
    ${card('Recent commits', `Latest on ${esc(r.defaultBranch || 'default')}`, commitsHtml(d.recentCommits), 'span')}
  `;
}

function card(title, sub, inner, extra = '') {
  return `<section class="card ${extra}">
    <h2>${esc(title)}</h2>
    <div class="sub">${esc(sub)}</div>
    ${inner}
  </section>`;
}

function repoHead(r) {
  const stat = (n, l) => `<div class="stat"><div class="n">${num(n)}</div><div class="l">${l}</div></div>`;
  return `<div class="repohead">
    <div class="title">
      <a class="name" href="${esc(r.htmlUrl)}" target="_blank" rel="noopener">${esc(r.fullName)}</a>
      ${r.archived ? '<span class="archived">archived</span>' : ''}
    </div>
    ${r.description ? `<div class="desc">${esc(r.description)}</div>` : ''}
    <div class="stats">
      ${stat(r.stars, '★ stars')}
      ${stat(r.forks, 'forks')}
      ${stat(r.watchers, 'watching')}
      ${stat(r.openIssues, 'open issues')}
      ${r.language ? `<div class="stat"><div class="n">${esc(r.language)}</div><div class="l">main language</div></div>` : ''}
      ${r.license ? `<div class="stat"><div class="n">${esc(r.license)}</div><div class="l">license</div></div>` : ''}
    </div>
    <div class="stats" style="margin-top:14px">
      <div class="stat"><div class="n" style="font-size:14px">${fmtDate(r.createdAt)}</div><div class="l">created</div></div>
      <div class="stat"><div class="n" style="font-size:14px">${fmtDate(r.pushedAt)}</div><div class="l">last push (${ago(r.pushedAt)})</div></div>
    </div>
    ${r.topics && r.topics.length ? `<div class="topics">${r.topics.map((t) => `<span class="topic">${esc(t)}</span>`).join('')}</div>` : ''}
  </div>`;
}

// --- Commits-per-week area/bar chart (hand-rolled SVG) -----------------------
function commitActivitySvg(weeks) {
  if (!weeks || !weeks.length) return `<div class="none">GitHub is still computing this (try again in a few seconds).</div>`;
  const W = 1040, H = 200, padL = 36, padB = 22, padT = 8;
  const counts = weeks.map((w) => w.total);
  const max = Math.max(1, ...counts);
  const n = weeks.length;
  const bw = (W - padL) / n;
  const y = (v) => padT + (H - padT - padB) * (1 - v / max);

  let bars = '';
  for (let i = 0; i < n; i++) {
    const h = (H - padT - padB) * (counts[i] / max);
    const x = padL + i * bw;
    bars += `<rect class="bar" x="${(x + 1).toFixed(1)}" y="${y(counts[i]).toFixed(1)}" width="${Math.max(1, bw - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="1">
      <title>${counts[i]} commits — week of ${new Date(weeks[i].week * 1000).toLocaleDateString()}</title></rect>`;
  }
  // y gridlines at 0, mid, max
  let grid = '';
  for (const v of [0, Math.round(max / 2), max]) {
    grid += `<line class="gridline" x1="${padL}" y1="${y(v)}" x2="${W}" y2="${y(v)}"/>
      <text class="axislabel" x="${padL - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
  }
  // x labels every ~13 weeks
  let xl = '';
  for (let i = 0; i < n; i += 13) {
    xl += `<text class="axislabel" x="${(padL + i * bw + bw / 2).toFixed(1)}" y="${H - padB + 14}" text-anchor="middle">${new Date(weeks[i].week * 1000).toLocaleDateString(undefined, { month: 'short', year: '2-digit' })}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${grid}${bars}${xl}</svg>`;
}

// --- Contributors ------------------------------------------------------------
function contributorsHtml(list) {
  if (!list || !list.length) return `<div class="none">No contributor data available.</div>`;
  const max = Math.max(...list.map((c) => c.contributions));
  return list.map((c) => `
    <div class="contrib">
      <img src="${esc(c.avatar)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"/>
      <div class="who"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.login)}</a></div>
      <div class="track"><div class="fill" style="width:${(100 * c.contributions / max).toFixed(1)}%"></div></div>
      <div class="c">${num(c.contributions)}</div>
    </div>`).join('');
}

// --- Languages ---------------------------------------------------------------
function languagesHtml(langs) {
  const entries = Object.entries(langs || {}).sort((a, b) => b[1] - a[1]);
  if (!entries.length) return `<div class="none">No language data available.</div>`;
  const total = entries.reduce((s, [, v]) => s + v, 0);
  const top = entries.slice(0, LANG_COLORS.length);
  const segs = top.map(([name, v], i) =>
    `<i style="width:${(100 * v / total).toFixed(2)}%;background:${LANG_COLORS[i]}" title="${esc(name)} ${(100 * v / total).toFixed(1)}%"></i>`).join('');
  const legend = top.map(([name, v], i) =>
    `<div class="li"><span class="dot" style="background:${LANG_COLORS[i]}"></span>${esc(name)} <span class="pct">${(100 * v / total).toFixed(1)}%</span></div>`).join('');
  return `<div class="langbar">${segs}</div><div class="langlegend">${legend}</div>`;
}

// --- Recent commits ----------------------------------------------------------
function commitsHtml(list) {
  if (!list || !list.length) return `<div class="none">No commits found.</div>`;
  return list.map((c) => `
    <div class="commit">
      <img src="${esc(c.avatar)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"/>
      <div class="body">
        <div class="msg"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.message)}</a></div>
        <div class="sub"><span class="sha">${esc(c.sha)}</span> · ${esc(c.authorName)} · ${esc(fmtDate(c.date))} (${esc(ago(c.date))})</div>
      </div>
    </div>`).join('');
}

// --- Punch card heatmap ------------------------------------------------------
function punchCardHtml(card) {
  if (!card || !card.length) return `<div class="none">GitHub is still computing this (try again in a few seconds).</div>`;
  // card rows: [dayOfWeek (0=Sun), hour (0-23), commits]
  const grid = Array.from({ length: 7 }, () => new Array(24).fill(0));
  let max = 0;
  for (const [day, hour, commits] of card) { grid[day][hour] = commits; if (commits > max) max = commits; }
  max = Math.max(1, max);
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const shade = (v) => {
    if (!v) return 'var(--chip)';
    const t = 0.18 + 0.82 * (v / max);
    return `rgba(217,119,87,${t.toFixed(3)})`;
  };
  let head = '<tr><th></th>';
  for (let h = 0; h < 24; h += 2) head += `<th colspan="2">${h}</th>`;
  head += '</tr>';
  let rows = '';
  for (let dd = 0; dd < 7; dd++) {
    rows += `<tr><td class="day">${days[dd]}</td>`;
    for (let h = 0; h < 24; h++) {
      const v = grid[dd][h];
      rows += `<td><div class="cell" style="background:${shade(v)}" title="${days[dd]} ${h}:00 — ${v} commits"></div></td>`;
    }
    rows += '</tr>';
  }
  return `<div class="punchwrap"><table class="punch">${head}${rows}</table></div>`;
}

// Deep-link support: #owner/name auto-loads.
const initial = decodeURIComponent(location.hash.replace(/^#/, ''));
if (initial) { repoInput.value = initial; load(initial); }
</script>
</body>
</html>
